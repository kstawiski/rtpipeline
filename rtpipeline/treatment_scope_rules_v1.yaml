  MP_interpretation: MP requires two gross targets with different organ-dominant geometry.
    Bladder GTV overlap must equal or exceed its other-pelvic-organ overlap. Another
    GTV must have at least 30% other-organ overlap, at least twice its bladder overlap,
    at most 50% pairwise containment and at least 20 mm centroid separation. This
    is not histological proof of distinct primary malignancies.

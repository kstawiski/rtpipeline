names:
  anatomy_regex:
    ambiguous_segments: segm[ ._]*(?:iv|vi|vii|viii)
    bladder: (?<![a-z])(?:bladder|urinary[ _]bladder|pecherz(?!yk)|pech(?![a-z]))
    nonpelvic: (?:mozg|brain|pien[ _]mozg|pluc|lung|piers|breast|kregoslup|spine|krtan|larynx|zuchw|mandibl|lopatk|scapul|mostek|sternum|watrob|liver|hepatic|humer|ramien|rib|zebr|skull|czasz|supraclav|nadobojcz|paraaort|para-aort|(?<![a-z])(?:th|t|l|c)[
      _]?[0-9]{1,2}(?![0-9]))
    other_pelvic_primary: (?:prostat|stercz|gruczol[ _]krokow|odbytnic|rectum|rectal|szyjka[
      _]macic|cervix|macic|uterus|uterine|endometri|vagin)
    pelvic_region: (?:miednic|pelvi|sacrum|sacral|k[ ._]*krzyz|kos[c]?c?[ _]krzyz|iliac|obturator|presacral)
    unlocalized_nodes: (?:wez|nodal|nodes|lymph|gtv[ _]*n)
  approval_status: pending
  classes:
    B: Documented bladder-directed targets, with or without regional elective pelvic
      nodes, and no separate other-primary or non-pelvic target.
    MP: Bladder and another distinct pelvic primary target in the same course, with
      no non-pelvic target.
    MX: Both pelvic and non-pelvic targets in the same course.
    P: Wholly pelvic non-bladder targets with no bladder-directed target.
    U: Generic, contradictory, unreadable or insufficient target evidence. No anatomical
      assignment based solely on OARs.
    X: Documented non-pelvic targets only.
  exceptions:
    bone: Unlocalized bone metastasis does not establish pelvis or nonpelvis.
    case_overrides: []
    cervical: Unqualified cervical is ambiguous between neck and uterine cervix.
    pecherzyk: Seminal vesicle, never urinary bladder by loose pech substring.
    sacrum: Pelvic bone, not automatically nonpelvic spine.
    segment_numbers: Segment IV/VIII and VI/VII are not accepted as an organ name.
      Record liver-compatible contextual evidence but retain U.
    trzon: Unqualified trzon may denote uterine or vertebral body and remains ambiguous.
  generic_policy: Generic targets remain U-with-evidence. Prescription and OAR vocabulary
    only annotate uncertainty, never determine a class. Explicit target anatomy on
    the same selected structure may resolve generic targets. Nodes without a named
    anatomical location do not establish pelvic anatomy. No cross-course borrowing.
  helper_regex:
  - ^(?:z|zz|marg|m_|ns_)
  - (?<![a-z])(?:gtv|ctv|ptv)[^+]*\+.*(?:gtv|ctv|ptv)
  - (?:gtv|ctv|ptv).*[-/]\s*(?:gtv|ctv|ptv)
  - (?:gtv|ctv|ptv).*[-/]\s*(?:[0-9.]*jel|bowel|esica|rect|odbyt)
  - (?:suma|sumaptv|orptv|and|\bw\s+ptv|\d\s*cm\s+od|crop|ring|optim|helper|margin|stary|stare|poprzednio|prechemo)
  normalization: NFKD remove accents, transliterate Polish l stroke, lowercase. Keep
    source ROI names unchanged in evidence.
  plausibility:
    absolute_dose_tolerance_gy: 0.1
    conventional_fractions:
    - 30
    - 33
    conventional_total_gy:
    - 60
    - 66
    exact_gy_fractions:
    - - 55
      - 20
    - - 64
      - 32
    - - 8
      - 1
    - - 20
      - 5
    - - 30
      - 10
    - - 36
      - 6
    interpretation: Compatibility screen, not proof of delivery or clinical appropriateness.
      Other prescriptions require review, not automatic anatomical reclassification.
      Weekly spacing is not established from a plan.
  schema: rtpipeline-names-target-scope-v1
  selection: If ROI interpreted type is nonblank, only GTV/CTV/PTV qualify. Otherwise
    use rtpipeline.rt_details.is_target_volume_name. Apply helper exclusions even
    to target-typed ROIs. Require a nonempty valid contour. Deduplicate structure
    UID and ROI number.

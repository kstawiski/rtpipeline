  approval_status: pending_PI
  centroid_vertebral_level: Nearest available segmented vertebral centroid in patient
    superior-inferior coordinate, not a claim that the target is inside that vertebra.
  classification_definition: All four criteria are reported without selection. B and
    MP require the relevant bladder criterion and wholly pelvic target geometry. X
    and MX are independent of the bladder criterion.
  coverage: CT contour-point bounds must contain all targets. Organ mask grid equals
    CT grid and union organ occupancy must span target z within 3 mm. Missing or contradictory
    geometry is U. An empty automatic bladder mask makes a wholly pelvic course U
    because B versus P cannot be established without assuming why the bladder was
    not segmented. X and MX do not require a bladder mask.
  criteria:
    C1:
      intersection_ml_min: 5
      target_fraction_min: 0.1
    C2:
      intersection_ml_min: 5
    C3:
      organ_fraction_min: 0.5
    C4:
      organ_fraction_min: 0.9
  frozen_utc: '2026-09-06T10:19:00.215406+00:00'
  helper_regex:
  - ^(?:z|zz|marg|m_|ns_)
  - (?<![a-z])(?:gtv|ctv|ptv)[^+]*\+.*(?:gtv|ctv|ptv)
  - (?:gtv|ctv|ptv).*[-/]\s*(?:gtv|ctv|ptv)
  - (?:gtv|ctv|ptv).*[-/]\s*(?:[0-9.]*jel|bowel|esica|rect|odbyt)
  - (?:suma|sumaptv|orptv|and|\bw\s+ptv|\d\s*cm\s+od|crop|ring|optim|helper|margin|stary|stare|poprzednio|prechemo)
  measurement:
    allclose_default_rtol: 1.0e-05
    axial_grid_atol: 0.0001
    contour_bound_extra_voxel: 0.001
    contour_bound_half_voxel: 0.5
    contour_plane_offset_voxel: 0.35
    contour_plane_spread_voxel: 0.1
    mask_grid_atol: 0.001
    orientation_atol: 1.0e-05
    origin_voxel_atol: 0.01
    pixel_equivalence_hu_atol: 0.01
    roundoff_epsilon_multiplier: 32
    spacing_mm_atol: 0.001
  organ_panel: Every mask named in the selected TotalSegmentator manifest. Actual
    labels and empty masks retained per course. No inferred labels for absent uterus
    or rectum.
  other_pelvic_primary_organs:
  - prostate
  - uterus
  - rectum
  overlap_csv_min_target_fraction: 0
  pelvis_definition: The pelvic slab extends from the inferior extent of the bilateral
    hip masks to the superior extent of L5, with 10 mm padding at each end. Without
    these landmarks, X requires every target to lie at least 10 mm above the lowest
    visible C1 to L4 vertebral inferior extent.
  prescription_screen:
    PTV_in_bladder_course_screen_ml:
    - 50
    - 3000
    TMT_fraction_size_gy:
    - 1.5
    - 1.8
    conventional_fractions:
    - 30
    - 33
    conventional_total_gy:
    - 60
    - 66
    definitive_TMT_total_gy:
    - 64
    - 64.8
    dose_tolerance_gy: 0.11
    general_target_volume_screen_ml:
    - 0.01
    - 10000
    induction_total_gy:
    - 40
    - 40.3
    interpretation: Screening flags are not proof of physically impossible targets
      or inappropriate therapy. Small focal boosts may be valid.
    schedules:
    - - 55
      - 20
    - - 64
      - 32
    - - 8
      - 1
    - - 20
      - 5
    - - 30
      - 10
    - - 36
      - 6
    - - 21
      - 3
    - - 30
      - 5
    timing: Twice-daily or split-course temporal spacing is not inferred from planned
      fractions.
  rasterization: Voxel centers on the exact planning CT grid represented in its provenance-bound
    NIfTI signed-axis orientation. All DICOM slice origins, sizes, spacing, series
    and frames checked. Closed contours filled by even-odd polygon rule. No contour
    interpolation or supersampling. Volume equals voxel count times voxel volume.
  reasoning: Exploratory sibling pelvic rule with four mandated bladder criteria.
    No criterion is selected. C2 uses absolute organ intersection rather than a target-relative
    fraction. Stability describes threshold dependence, not anatomical validity.
  requested_but_not_provided:
  - uterus
  - rectum
  schema: rtpipeline-geometric-scope-v1
  selected_criterion: null
  target_selection: Nonblank GTV/CTV/PTV interpreted types take precedence. Otherwise
    use the existing rtpipeline.rt_details.is_target_volume_name function. The requested
    is_target_volume_candidate symbol does not exist in this checkout. Helpers and
    contour-empty targets are excluded. ROI names are retained but not used for anatomical
    geometry.
  variants:
    C1:
      bladder_min_overlap_ml: 5
      bladder_target_fraction: 0.1
      coverage_tolerance_mm: 3
      distinct_target_max_containment: 0.5

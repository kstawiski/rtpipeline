# Versioned CT ROI-class governance map. Conservative rules and exact governance.
schema_version: 1
map_version: ct-roi-class-map-2026-09-06-v6
name_rules:
  version: ct-roi-name-rules-v1
  normalization: >-
    ASCII case folding and whitespace collapse, Unicode hyphen/nonbreaking
    hyphen/en dash/minus to ASCII hyphen, spaces around plus/minus removed,
    and one index gap removed only in a complete unqualified target identifier.
    Other operators, digit strings, underscores, prefixes, suffixes and
    diacritics are retained. This is class lookup, never contour identity.
  collision_policy: unresolved_mixed_on_class_or_adjudication_disagreement
  target_detector: rtpipeline.rt_details.is_target_volume_name
  crop_anatomy_names:
    - odbytnica
    - pecherz
    - pęcherz
    - nerka l
    - nerka p
    - pluco lewe
    - pluco prawe
    - pluco suma
    - plucop
    - odb
    - serce
  crop_anatomy_evidence_basis: >-
    Polish organ names for rectum, bladder, kidney, lung and heart identify
    subtraction operands only. They do not adjudicate the organ tissue class.
    Additional K/M lung qualifiers require review and are not normalized away.
  rules:
    unqualified_target:
      roi_class: target
      adjudication_status: resolved_by_name_rule
      evidence_basis: >-
        Shared target detector plus complete unqualified identifier guard.
        CTV/PTV/GTV with optional integer index, or GTV with n/p/m and optional
        integer index, denote clinical/planning/gross target volumes.
        No other prefix, suffix, operator or tissue name is admitted.
    boolean_subtraction:
      roi_class: planning_helper
      adjudication_status: resolved_by_name_rule
      evidence_basis: >-
        Subtraction between two unqualified targets or an identified organ
        minus an unqualified target is a Boolean planning crop, not a target.
        Target-minus-organ can instead be a target's anatomic qualifier and
        requires review, as do unknown operands and mixed-tissue additions.
    distance_margin:
      roi_class: planning_helper
      adjudication_status: resolved_by_name_rule
      evidence_basis: >-
        A numeric mm/cm distance followed by Polish od and an unqualified
        target denotes a planning-distance construct, with optional zz_ prefix.
    optimization_helper:
      roi_class: planning_helper
      adjudication_status: resolved_by_name_rule
      evidence_basis: >-
        A z, marg, z_marg or z_min prefix attached to an otherwise unqualified
        target denotes a planning-control contour, never a target.

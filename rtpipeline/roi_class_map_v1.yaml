derived_crosswalk:
  bowel_bag:
    roi_class: hollow_pelvic_organ
    require_provenance: true
  iliac_vess:
    roi_class: vessel
    require_provenance: true
  iliac_area:
    roi_class: planning_helper
    require_provenance: true
    evidence_basis: nonzero vessel expansion includes non-vessel tissue for dose planning
  pelvic_bones:
    roi_class: bone
    require_provenance: true
  pelvic_bones_3mm:
    roi_class: planning_helper
    require_provenance: true
    evidence_basis: nonzero bone expansion includes non-bone tissue for treatment planning
governance_notes:
  - Manual and project-local class lookup uses versioned conservative name_rules before exact fallback.
  - Normalization never changes contour identity or discards semantic operators.
  - Explicit pending entries and conflicting normalized entries remain unresolved_mixed.
  - Unqualified target identifiers reuse rt_details.is_target_volume_name with a full-name qualifier guard.
  - Mixed expressions, unknown qualifiers and unknown tissue operands require operator adjudication.
  - Derived entries apply only when operation and base structures are recorded.
  - A recorded nonzero margin produces a planning helper rather than anatomy.

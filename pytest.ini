[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
markers =
    integration: invokes an installed external conversion executable
    concern_a: bound DoseReferenceUID identity across summed plans
    concern_b: abandoned partial delivery and the primary scalar
    concern_c: session completeness beyond one NORMAL event
    concern_d: no fraction-weighted fallback over contradictions
    concern_e: replacement-chain fraction denominator
    concern_f: membership, provenance and publication invariants
    helper_parity: conflicting copies, SETUP items, exact duplicates and continuations at the adjudicator
    semantics: RTRECORD calculated-dose semantics
    requires_radiomics_env: needs the rtpipeline-radiomics conda environment (PyRadiomics, NumPy 1.x)
    requires_snakemake: needs the snakemake executable

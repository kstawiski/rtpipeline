name: rtpipeline-radiomics
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26.*
  - scipy
  - pandas
  - SimpleITK
  - pydicom>=3.0.2,<4
  - pyyaml
  - pip
  - pip:
    - "numpy<2.0"
    - dataclasses  # rt-utils declares this backport even on Python 3.10
    # NOTE: conda runs pip from the env YAML directory (`/app/envs` in Docker),
    # so the wheel path must be relative to that location.
    - ../third_party/wheels/pyradiomics-3.0.1-cp310-cp310-linux_x86_64.whl
    - xlsxwriter
    - pingouin
    - pyarrow
    - openpyxl
    - filelock>=3.20.3
    # Single OpenCV provider pinned for reproducible cv2.fillPoly RTSTRUCT rasterization.
    # rt-utils==1.2.7 is installed in a post-step with `pip install --no-deps "rt-utils==1.2.7"`
    # (its other dependencies numpy, pydicom and dataclasses are listed explicitly above) so its
    # unpinned `opencv-python` requirement cannot overwrite opencv-python-headless==4.8.1.78.
    - opencv-python-headless==4.8.1.78

name: rtpipeline-radiomics
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.*
  - scipy
  - pandas
  - simpleitk
  - pydicom>=3.0.2,<4
  - pyyaml
  - pywavelets
  - pykwalify
  - six
  - scikit-image
  - xlsxwriter
  - pingouin>=0.5.3
  - pyarrow
  - openpyxl
  - filelock>=3.20.3
  # Non-Linux platforms compile the pinned PyRadiomics source release.
  - c-compiler
  - cxx-compiler
  - cmake
  - ninja
  - cython<3
  - setuptools<70
  - wheel
  - pip
  - pip:
    - dataclasses  # rt-utils declares this backport even on Python 3.10
    # Single OpenCV provider pinned for reproducible cv2.fillPoly RTSTRUCT rasterization.
    # rt-utils==1.2.7 is installed in scripts/install_local.sh with `pip install --no-deps`.
    - opencv-python-headless==4.8.1.78
